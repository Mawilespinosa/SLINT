<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Arial, sans-serif">
  <rect width="1280" height="800" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="64" fill="#ececec" stroke="#9a9a9a"/>
  <text x="24" y="40" font-size="20" font-weight="bold" fill="#333">SLINT · INT-09 Detalle de horas extra</text>
  <text x="820" y="40" font-size="13" fill="#555">Turnos · Liquidaciones · Reportes · Administración</text>

  <text x="24" y="104" font-size="15" font-weight="bold" fill="#333">Horas extra identificadas</text>

  <rect x="24" y="124" width="1232" height="260" rx="4" fill="#fafafa" stroke="#9a9a9a"/>
  <line x1="24" y1="168" x2="1256" y2="168" stroke="#bbb"/>
  <text x="40" y="152" font-size="13" font-weight="bold" fill="#444">Tipo</text>
  <text x="280" y="152" font-size="13" font-weight="bold" fill="#444">Cantidad de horas</text>
  <text x="560" y="152" font-size="13" font-weight="bold" fill="#444">Criterio / parámetro</text>
  <text x="920" y="152" font-size="13" font-weight="bold" fill="#444">Vigencia</text>

  <text x="40" y="204" font-size="13" fill="#444">Extra diurna</text><text x="280" y="204" font-size="13" fill="#444">0.0</text><text x="560" y="204" font-size="12" fill="#555">Jornada diurna de ejemplo</text><text x="920" y="204" font-size="12" fill="#555">Demostración</text>
  <line x1="24" y1="220" x2="1256" y2="220" stroke="#eee"/>
  <text x="40" y="252" font-size="13" fill="#444">Extra nocturna</text><text x="280" y="252" font-size="13" fill="#444">1.5</text><text x="560" y="252" font-size="12" fill="#555">Recargo nocturno de ejemplo</text><text x="920" y="252" font-size="12" fill="#555">Demostración</text>
  <line x1="24" y1="268" x2="1256" y2="268" stroke="#eee"/>
  <text x="40" y="300" font-size="13" fill="#444">Total extra</text><text x="280" y="300" font-size="13" font-weight="bold" fill="#333">1.5</text><text x="560" y="300" font-size="12" fill="#555">—</text><text x="920" y="300" font-size="12" fill="#555">—</text>

  <rect x="24" y="412" width="600" height="90" fill="#fbf0f0" stroke="#c9a3a3" stroke-dasharray="4 3"/>
  <text x="40" y="442" font-size="14" font-weight="bold" fill="#7a4a4a">Aviso obligatorio</text>
  <text x="40" y="470" font-size="12" fill="#7a4a4a">Cálculo simulado / datos de ejemplo. Los valores no son definitivos.</text>

  <rect x="648" y="412" width="608" height="90" fill="#f7f7f7" stroke="#9a9a9a"/>
  <text x="664" y="442" font-size="14" font-weight="bold" fill="#333">Cómo se interpreta</text>
  <text x="664" y="470" font-size="12" fill="#555">Las horas extra se derivan de la clasificación del turno en INT-07.</text>

  <rect x="24" y="540" width="260" height="42" rx="4" fill="#fff" stroke="#9a9a9a"/>
  <text x="154" y="567" text-anchor="middle" font-size="13" fill="#555">Volver al flujo (INT-07)</text>
</svg>
