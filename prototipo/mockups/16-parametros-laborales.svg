  <rect x="24" y="510" width="1232" height="90" fill="#fbf0f0" stroke="#c9a3a3" stroke-dasharray="4 3"/>
  <text x="40" y="538" font-size="13" font-weight="bold" fill="#7a4a4a">Demostración visual sin persistencia</text>
  <text x="40" y="562" font-size="12" fill="#7a4a4a">Los parámetros muestran su fecha de vigencia (HU-10 CA3). No hay CRUD completo ni almacenamiento.</text>
  <text x="40" y="582" font-size="12" fill="#7a4a4a">Validaciones frontend: campos obligatorios, valor numérico y fecha de fin no anterior a la de inicio.</text>

  <rect x="24" y="630" width="260" height="40" rx="4" fill="#fff" stroke="#9a9a9a"/>
  <text x="154" y="655" text-anchor="middle" font-size="12" fill="#555">Volver al dashboard (INT-02)</text>
