  <rect x="820" y="226" width="90" height="22" rx="3" fill="#e6f2e6" stroke="#8fbf8f"/><text x="865" y="242" text-anchor="middle" font-size="11" fill="#2f6b2f">Vigente</text>
  <line x1="24" y1="260" x2="924" y2="260" stroke="#eee"/>
